name: KidsExplorer
options:
  bundleIdPrefix: com.kidsapp
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"
  defaultConfig: Debug
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  KidsExplorer:
    type: application
    platform: iOS
    sources:
      - path: Sources/KidsExplorer
        excludes:
          - "**/.DS_Store"
    info:
      path: KidsExplorer/Info.plist
      properties:
        CFBundleName: おうちたんけん
        CFBundleDisplayName: おうちたんけん
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: ja
        NSCameraUsageDescription: カメラを使って、おうちの中でぼうけんしよう！まほうのせかいをみせてあげるよ！
        NSMicrophoneUsageDescription: マイクは使いません
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleDefault
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.kidsapp.kidsexplorer
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      DEVELOPMENT_TEAM: ""
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: UIKit.framework
