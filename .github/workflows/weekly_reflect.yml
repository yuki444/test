name: Weekly Reflection

on:
  schedule:
    # 毎週月曜 23:00 UTC (火曜 08:00 JST)
    - cron: '0 23 * * 1'
  workflow_dispatch:
    inputs:
      date:
        description: '処理する日付 (YYYY-MM-DD、空欄=今日)'
        required: false
        default: ''

jobs:
  reflect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements_stock.txt

      - name: Resolve date
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(date +%Y-%m-%d)
          fi
          echo "DATE=$DATE" >> $GITHUB_ENV

      - name: Run weekly reflection
        run: python scripts/weekly_reflect.py --date "$DATE"

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ docs/ config/scoring_weights.json
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore(stock): weekly reflection for $DATE"
            git push
          fi
