name: Daily Music Generation

on:
  schedule:
    # 毎日 11:00 JST (UTC 02:00) — Agent①: 歌詞生成のみ
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '処理する日付 (YYYY-MM-DD、空欄=今日)'
        required: false
        default: ''

# NOTE: Agent② (Suno作曲) はローカルPCの scripts/run_daily.sh で実行。
#       作曲完了後 results.json が push されると post_process.yml が起動し
#       Agent③④ (動画化・YouTube投稿) を自動実行します。

jobs:
  generate_lyrics:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve date
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(date +%Y-%m-%d)
          fi
          echo "DATE=$DATE" >> $GITHUB_ENV

      - name: Agent① — 歌詞ファイルを作成（なければテンプレートをコピー）
        run: |
          LYRICS_DIR="lyrics/$DATE"
          LYRICS_FILE="$LYRICS_DIR/song.txt"
          if [ -f "$LYRICS_FILE" ]; then
            echo "歌詞ファイルは既にあります: $LYRICS_FILE"
          else
            mkdir -p "$LYRICS_DIR"
            cp lyrics/template/song.txt "$LYRICS_FILE"
            echo "テンプレートをコピーしました: $LYRICS_FILE"
            echo "NEEDS_COMMIT=true" >> $GITHUB_ENV
          fi

      - name: 歌詞ファイルをコミット
        if: env.NEEDS_COMMIT == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "lyrics/$DATE/song.txt"
          git commit -m "chore: $DATE の歌詞テンプレートを追加"
          git push
