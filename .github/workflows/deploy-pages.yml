name: Deploy Apps to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'static/**'
      - 'financial-planner/**'
      - 'pokapoka-garden/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy directory
        run: |
          mkdir _deploy
          cp static/index.html _deploy/index.html
          cp -r financial-planner _deploy/financial-planner
          cp -r pokapoka-garden _deploy/pokapoka-garden

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
