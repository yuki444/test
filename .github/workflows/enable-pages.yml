name: Enable GitHub Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages source to gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          echo "=== 現在のPages設定 ==="
          CURRENT=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO/pages)
          echo "$CURRENT" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          print('source branch:', d.get('source',{}).get('branch','none'))
          print('build_type:', d.get('build_type','none'))
          print('status:', d.get('status','none'))
          print('custom_domain:', d.get('custom_domain','(none)'))
          print('html_url:', d.get('html_url','none'))
          print('FULL JSON:', json.dumps(d, indent=2))
          " 2>/dev/null || echo "Pages未設定"

          echo "=== build_type=legacy でgh-pagesブランチに切替 ==="
          RESULT=$(curl -s -w "\n%{http_code}" -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/$REPO/pages \
            -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}')
          BODY=$(echo "$RESULT" | head -1)
          CODE=$(echo "$RESULT" | tail -1)
          echo "HTTP: $CODE / Body: $BODY"

          if [ "$CODE" != "204" ] && [ "$CODE" != "200" ]; then
            echo "PUT失敗。POSTを試みます..."
            curl -s -w "\nHTTP: %{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              https://api.github.com/repos/$REPO/pages \
              -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          fi

          echo "=== 更新後の設定 ==="
          curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO/pages | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          print('source branch:', d.get('source',{}).get('branch','none'))
          print('build_type:', d.get('build_type','none'))
          print('url:', d.get('html_url','none'))
          " 2>/dev/null
          echo "URL: https://$OWNER.github.io/$REPO_NAME/"
