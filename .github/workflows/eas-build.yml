name: EAS Build iOS

on:
  push:
    branches: [main]
    paths: ['kirino-mura-app/**']
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: false
        default: 'preview'
        type: choice
        options: [preview, production]

jobs:
  build:
    name: EAS Build (iOS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kirino-mura-app/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: kirino-mura-app
        run: npm ci

      - name: Build iOS
        working-directory: kirino-mura-app
        env:
          EXPO_PUBLIC_CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          eas build --platform ios --profile "$PROFILE" --non-interactive
