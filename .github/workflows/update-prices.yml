name: Update Stock Prices

on:
  schedule:
    # 平日 07:00 UTC = 16:00 JST（東京市場終値確定後）
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest prices and dividends
        run: python scripts/update_prices.py

      - name: Commit and push to main if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add financial-planner/prices.json
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "chore: update stock prices & dividends $(date +%Y-%m-%d)" && \
            git push origin HEAD:main
